<div class="company-container">

  <div class="company-card">

    <div class="company-header">
      <h1>Bem-vindo ao Hitbox</h1>

      <p>
        Para começar, precisamos cadastrar sua empresa.
      </p>
    </div>

    <form [formGroup]="form" (ngSubmit)="save()">

      <div class="form-grid">

        <div class="form-group full-width">
          <label>Razão Social *</label>
          <input type="text" formControlName="companyName" placeholder="Ex: Hitbox Tecnologia LTDA">
        </div>

        <div class="form-group full-width">
          <label>Nome Fantasia</label>
          <input type="text" formControlName="tradeName" placeholder="Ex: Hitbox">
        </div>
        <div class="form-group">
          <label>Tipo de Documento <small>(Opcional)</small></label>
          <select name="docType" id="docType" formControlName="documentType" class="form-select">
            <option [value]="'NONE'">Nenhum</option>
            <option [value]="'CPF'">Pessoa Física</option>
            <option [value]="'CNPJ'">MEI/EMPRESA</option>
          </select>
        </div>

        <div *ngIf="form.get('documentType')?.value === 'CNPJ'" class="form-group">
          <label>CNPJ</label>
          <input type="text" formControlName="document" mask="00.000.000/0000-00" placeholder="00.000.000/0000-00">
        </div>

        <div *ngIf="form.get('documentType')?.value === 'CPF'" class="form-group">
          <label>CPF</label>
          <input type="text" formControlName="document" mask="000.000.000-00" placeholder="000.000.000-00">
        </div>

        <div class="form-group">
          <label>Telefone</label>
          <input type="text" formControlName="phone" mask="(00) 00000-0000" placeholder="(11) 99999-9999">
        </div>

        <div class="form-group full-width">
          <label>Email Corporativo *</label>
          <input type="email" formControlName="email" placeholder="contato@suaempresa.com.br">
        </div>

        <div class="form-group full-width">
          <label>Slug da Organização *</label>

          <div class="slug-container">
            <span>hitbox.com.br/</span>

            <input type="text" formControlName="slug" placeholder="minha-empresa">
          </div>

          <small>
            Este endereço será utilizado para identificar sua organização.
          </small>
        </div>

        <div class="form-group full-width">
          <label>Plano</label>

          <select formControlName="planType">
            <option value="FREE">Free</option>
            <option value="STARTER">Starter</option>
            <option value="PROFESSIONAL">Professional</option>
            <option value="ENTERPRISE">Enterprise</option>
          </select>
        </div>

      </div>

      <div class="actions">

        <button type="submit" [disabled]="form.invalid">

          Criar Empresa
        </button>

      </div>

    </form>

  </div>

</div>
