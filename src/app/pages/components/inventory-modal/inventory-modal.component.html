<div
  class="modal fade"
  id="inventoryModal"
  tabindex="-1">

  <div
    class="modal-dialog modal-dialog-centered">

    <div class="modal-content app-modal">

      <!-- HEADER -->

      <div class="modal-header border-0">

        <div>

          <h4 class="fw-bold mb-1">
            Novo Item de Estoque
          </h4>

          <p class="text-muted mb-0">
            Cadastre um recurso para produção
          </p>
        </div>

        <button
          type="button"
          class="btn-close btn-close-white"
          data-bs-dismiss="modal">
        </button>

      </div>

      <!-- BODY -->

      <div class="modal-body pt-0">

        <form
          [formGroup]="form"
          class="row g-3">

          <!-- IMAGE -->

          <div class="col-12">

            <div class="inventory-image">

              @if(imagePreview) {

                <img
                  [src]="imagePreview">

              } @else {

                <i class="bi bi-box-seam"></i>

              }

            </div>

            <label
              class="btn btn-outline-primary w-100 mt-3">

              <i class="bi bi-upload me-2"></i>

              Selecionar imagem

              <input
                hidden
                type="file"
                accept="image/*"
                (change)="onImageChange($event)">

            </label>

          </div>

          <!-- NAME -->

          <div class="col-12">

            <label class="form-label">
              Nome
            </label>

            <input
              type="text"
              class="form-control"
              formControlName="name"
              placeholder="PLA Preto 1kg">

          </div>

          <!-- CATEGORY -->

          <div class="col-md-6">

            <label class="form-label">
              Categoria
            </label>

            <select
              class="form-select"
              formControlName="category">

              <option value="">
                Selecione
              </option>

              <option value="Filamento">
                Filamento
              </option>

              <option value="Resina">
                Resina
              </option>

              <option value="Embalagem">
                Embalagem
              </option>

              <option value="Acessório">
                Acessório
              </option>

            </select>

          </div>

          <!-- UNIT -->

          <div class="col-md-6">

            <label class="form-label">
              Unidade
            </label>

            <select
              class="form-select"
              formControlName="unit">

              <option value="g">
                Gramas
              </option>

              <option value="kg">
                Quilos
              </option>

              <option value="un">
                Unidade
              </option>

              <option value="m">
                Metro
              </option>

            </select>

          </div>

          <!-- QUANTITY -->

          <div class="col-md-6">

            <label class="form-label">
              Quantidade
            </label>

            <input
              type="number"
              class="form-control"
              formControlName="quantity">

          </div>

          <!-- MINIMUM -->

          <div class="col-md-6">

            <label class="form-label">
              Estoque mínimo
            </label>

            <input
              type="number"
              class="form-control"
              formControlName="minimumStock">

          </div>

          <!-- COST -->

          <div class="col-md-6">

            <label class="form-label">
              Custo
            </label>

            <div class="input-group">

              <span class="input-group-text">
                R$
              </span>

              <input
                type="number"
                class="form-control"
                formControlName="cost">

            </div>

          </div>

          <!-- SUPPLIER -->

          <div class="col-md-6">

            <label class="form-label">
              Fornecedor
            </label>

            <input
              type="text"
              class="form-control"
              formControlName="supplier">

          </div>

          <!-- LOCATION -->

          <div class="col-12">

            <label class="form-label">
              Localização
            </label>

            <input
              type="text"
              class="form-control"
              formControlName="location"
              placeholder="Prateleira A-02">

          </div>

          <!-- ACTIVE -->

          <div class="col-12">

            <div class="form-check form-switch">

              <input
                type="checkbox"
                class="form-check-input"
                formControlName="active">

              <label class="form-check-label">
                Item ativo
              </label>

            </div>

          </div>

        </form>

      </div>

      <!-- FOOTER -->

      <div class="modal-footer border-0">

        <button
          class="btn btn-outline-secondary"
          data-bs-dismiss="modal">

          Cancelar

        </button>

        <button
          class="btn btn-primary"
          [disabled]="loading"
          (click)="submit()">

          @if(loading) {

            <span
              class="spinner-border spinner-border-sm me-2">
            </span>

          }

          Salvar item

        </button>

      </div>

    </div>

  </div>

</div>
