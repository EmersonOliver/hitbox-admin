<div class="pricing-step">

    <div class="step-header">

        <h4>
            <i class="bi bi-sliders me-2"></i>
            Variáveis de Precificação
        </h4>
        <p>
            Configure os parâmetros que poderão influenciar o cálculo dos seus produtos.
        </p>
    </div>

    <!-- NOVA VARIÁVEL -->

    <div class="card pricing-card">

        <div class="card-body">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <h5 class="mb-0">
                    Variáveis Configuradas
                </h5>

                <button type="button" class="btn btn-primary" (click)="addVariable()">

                    <i class="bi bi-plus-lg me-2"></i>

                    Nova Variável

                </button>


            </div>

            <form [formGroup]="form" (ngSubmit)="next(5)">
                <div formArrayName="variables" class="variable-list">

                    <div *ngFor="let variable of variables.controls; let i = index" [formGroupName]="i"
                        class="variable-card">

                        <div class="row g-3">

                            <div class="col-md-4">
                                <label class="form-label">
                                    Nome da Variável
                                </label>
                                <input type="text" class="form-control" formControlName="name"
                                    placeholder="Ex: Tempo de Impressão">
                            </div>

                            <div class="col-md-3">
                                <label class="form-label">

                                    Tipo

                                </label>

                                <select class="form-select" formControlName="type">

                                    <option value="number">
                                        Numérico
                                    </option>

                                    <option value="text">
                                        Texto
                                    </option>

                                    <option value="boolean">
                                        Sim / Não
                                    </option>

                                    <option value="select">
                                        Lista
                                    </option>

                                </select>

                            </div>

                            <div class="col-md-3">

                                <label class="form-label">

                                    Unidade

                                </label>

                                <input type="text" class="form-control" formControlName="unit" placeholder="h, g, mm">

                            </div>

                            <div class="col-md-2">

                                <label class="form-label">

                                    Obrigatória

                                </label>

                                <div class="form-check mt-2">

                                    <input type="checkbox" class="form-check-input" formControlName="required">

                                </div>

                            </div>

                        </div>

                        <!-- IMPACTO NO PREÇO -->

                        <div class="impact-section">

                            <label class="form-label">

                                Impacto no Preço

                            </label>

                            <div class="row g-3">

                                <div class="col-md-4">

                                    <select class="form-select" formControlName="impactType">

                                        <option value="fixed">
                                            Valor Fixo
                                        </option>

                                        <option value="percentage">
                                            Percentual
                                        </option>

                                        <option value="multiplier">
                                            Multiplicador
                                        </option>

                                    </select>

                                </div>

                                <div class="col-md-4">

                                    <input type="number" class="form-control" formControlName="impactValue"
                                        placeholder="Valor">

                                </div>

                            </div>

                        </div>

                        <div class="text-end mt-3">
                            <button type="button" class="btn btn-outline-danger" (click)="removeVariable(i)">
                                <i class="bi bi-trash"></i>
                                Remover
                            </button>
                        </div>

                    </div>

                </div>
                <div class="row g-4 mt-2 py-2 m-2">
                    <button class="btn btn-primary" type="submit" [disabled]="form.invalid">Próximo</button>
                </div>
                   <div class="row g-4 mt-2 py-2 m-2">
                    <button class="btn btn-secondary" type="button" (click)="back(3)">Voltar</button>
                </div>
            </form>

        </div>
    </div>

    <!-- EXEMPLOS -->

    <div class="card helper-card">

        <div class="card-body">

            <h6>
                Sugestões para Impressão 3D
            </h6>

            <div class="suggestion-list">

                <span class="badge bg-secondary">
                    Tempo de Impressão
                </span>

                <span class="badge bg-secondary">
                    Peso
                </span>

                <span class="badge bg-secondary">
                    Altura
                </span>

                <span class="badge bg-secondary">
                    Cor Especial
                </span>

                <span class="badge bg-secondary">
                    Acabamento
                </span>

                <span class="badge bg-secondary">
                    Suporte
                </span>

                <span class="badge bg-secondary">
                    Quantidade
                </span>

            </div>

        </div>

    </div>

</div>
