<div class="dashboard-header">
  <div class="row">
    <div class="col-md-8">
      <h4>Dashboard</h4>
      <small class="text-muted">Visão geral de produção</small>
    </div>
    <div class="col-md-4">
      <!-- <input type="date" class="form-control form-date"> -->
      <input type="text" placeholder="Daterangepicker" class="form-control" bsDaterangepicker>
    </div>
  </div>
</div>
<div class="row g-3 mb-4">
  <div class="col-md-3">
    <div class="card p-3 shadow">
      <small class="text-muted"><i class="bi bi-currency-dollar me-2 text-primary"></i>Receita Total</small>
      <h4>{{12580.90 | currency:'BRL'}}</h4>
    </div>
  </div>

  <div class="col-md-3">
    <div class="card p-3 shadow">
      <small class="text-muted"><i class="bi bi-cart me-2 text-primary"></i>Custo de Produção</small>
      <h4>{{4235.40 | currency:'BRL'}}</h4>
    </div>
  </div>

  <div class="col-md-3">
    <div class="card p-3 shadow">
      <small class="text-muted"><i class="bi bi-graph-up-arrow me-2 text-primary"></i>Lucro Líquido</small>
      <h4>{{8345.50 | currency:'BRL'}}</h4>
    </div>
  </div>

  <div class="col-md-3">
    <div class="card p-3 shadow">
      <small class="text-muted"><i class="bi bi-percent me-2 text-primary"></i>Margem de Lucro</small>
      <h4>66,3%</h4>
    </div>
  </div>
</div>
<!-- QUICK ACTIONS -->
<div class="quick-actions-grid">

  <div class="action-tile primary">
    <i class="bi bi-plus-lg me-2"></i>
    <div>
      <h6>Novo Produto</h6>
      <small>Criar rapidamente</small>
    </div>
  </div>

  <div class="action-tile success">
    <i class="bi bi-play me-2"></i>
    <div>
      <h6>Novo Registro</h6>
      <small>Fluxo de produção</small>
    </div>
  </div>

  <div class="action-tile neutral">
    <i class="bi bi-box-seam me-2"></i>
    <div>
      <h6>Inventário</h6>
      <small>Gerenciar base</small>
    </div>
  </div>
</div>
