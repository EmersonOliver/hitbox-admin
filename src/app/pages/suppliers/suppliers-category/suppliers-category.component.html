<div class="container-fluid py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="fw-bold mb-1">
                Categorias de Fornecedores
            </h2>

            <p class="text-muted mb-0">
                Organize seus fornecedores por segmentos e especialidades.
            </p>

        </div>
        <div>
            <button class="btn btn-outline-secondary me-2" title="Voltar" routerLink="/fornecedores"><i
                    class="bi bi-arrow-left"></i></button>

            <button class="btn btn-primary" (click)="save()">

                <i class="bi bi-plus-circle me-2"></i>

                Nova Categoria

            </button>
        </div>


    </div>

    <div class="category-card">

        <div class="row mb-4">

            <div class="col-lg-4">

                <input type="text" class="form-control" placeholder="Pesquisar categoria">

            </div>

        </div>

        <div class="table-responsive">

            <table class="table align-middle">

                <thead>

                    <tr>

                        <th>Nome</th>

                        <th>Descrição</th>

                        <th>Fornecedores</th>

                        <th>Status</th>

                        <th width="180">Ações</th>

                    </tr>

                </thead>

                <tbody>

                    <tr>

                        <td>

                            <strong>
                                Matéria-Prima
                            </strong>

                        </td>

                        <td>

                            Fornecedores de insumos produtivos

                        </td>

                        <td>

                            24

                        </td>

                        <td>

                            <span class="badge bg-success">
                                Ativa
                            </span>

                        </td>

                        <td>

                            <button class="btn btn-outline-primary btn-sm me-2">

                                <i class="bi bi-pencil"></i>

                            </button>

                            <button class="btn btn-outline-danger btn-sm">

                                <i class="bi bi-trash"></i>

                            </button>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>
