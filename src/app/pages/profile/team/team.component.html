<app-toast></app-toast>
<div class="container-fluid py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="fw-bold mb-1">
                Equipes
            </h2>

            <p class="text-muted mb-0">
                Organize usuários por departamentos
            </p>

        </div>

        <button class="btn btn-primary" (click)="addTeam()">

            <i class="bi bi-plus-circle me-2"></i>

            Nova Equipe

        </button>

    </div>

    <!-- BUSCA -->

    <div class="team-search mb-4">

        <input type="text" class="form-control" placeholder="Buscar equipe...">

    </div>

    <!-- LISTA -->

    <div class="team-grid">

        <div *ngFor="let t of teams" class="team-card" (click)="openModal(t)">
            <div class="team-icon">
                <i class="bi bi-gear"></i>
            </div>
            <div class="team-content">
                <h5>
                    {{t.teamName}}
                </h5>
                <small>
                    Status: {{t.active ? 'Ativo':'Inativo'}}
                </small>
            </div>

            <div class="team-meta">
                <span class="badge text-bg-primary">
                    @if(t.members.length >= 1 ){
                        {{t.totalMembers}} membro
                    }@else if(t.members.length > 1){
                        {{t.totalMembers}} membros
                    }@else{
                        Nenhum membro
                    }
                </span>
                <i class="bi bi-chevron-right"></i>
            </div>
        </div>
    </div>

</div>

<app-team-modal [teamSelected]="teamSelected"></app-team-modal>
<app-add-team-modal (saveEmit)="loadTeams()"></app-add-team-modal>
