<div class="container-fluid py-4">
    <app-toast></app-toast>
    <form [formGroup]="form" (ngSubmit)="savePermissions()">

        <!-- HEADER -->

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h2 class="fw-bold mb-1">
                    Permissões
                </h2>

                <p class="text-muted mb-0">
                    Controle os acessos de cada perfil do sistema
                </p>

            </div>

            <button class="btn btn-primary" type="submit">

                <i class="bi bi-floppy me-2"></i>

                Salvar Alterações

            </button>

        </div>

        <!-- ROLE -->

        <div class="permission-toolbar mb-4">
            <div class="row">

                <div class="col-md-4">

                    <label class="form-label">

                        Perfil

                    </label>

                    <select formControlName="teamId" class="form-select"
                        (change)="loadPermissionsByIdTeam(form.get('teamId')?.value)">
                        <option [value]="null" [disabled]="true">Selecione</option>
                        @for(team of teams;track team.teamId) {
                        <option [value]="team.teamId">{{team.teamName}}</option>
                        }
                    </select>

                </div>

            </div>

        </div>
        <!-- MODULES -->

        <div formArrayName="teamPermissions" class="row g-4">

            <div class="col-xl-4 col-lg-6" *ngFor="let module of permissionsArrayForm.controls; let i = index"
                [formGroupName]="i">

                <div class="permission-card">

                    <div class="permission-header">

                        <div>

                            <h5>{{ module.get('moduleName')?.value }}</h5>

                            <small>{{ module.get('moduleCode')?.value }}</small>

                        </div>

                        <i class="bi bi-box-seam"></i>

                    </div>

                    <div class="permission-body" formArrayName="permissions">

                        <div class="form-check" *ngFor="let permission of permissionsOf(i).controls; let j = index"
                            [formGroupName]="j">

                            <input class="form-check-input" type="checkbox" formControlName="granted"
                                [id]="'permission-' + i + '-' + j">

                            <label class="form-check-label" [for]="'permission-' + i + '-' + j">

                                {{ permission.get('permissionName')?.value }}

                            </label>

                        </div>

                    </div>

                </div>

            </div>

        </div>
    </form>

</div>
