<div class="modal fade" id="addTeamModal" tabindex="-1">

  <div class="modal-dialog modal-dialog-centered">

    <div class="modal-content app-modal">

      <!-- HEADER -->

      <div class="modal-header border-0">
        <div>
          <h4 class="fw-bold mb-1">
            Nova Equipe
          </h4>

          <p class="text-muted mb-0">
            Crie uma nova equipe para sua empresa
          </p>
        </div>

        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal">
        </button>

      </div>

      <!-- BODY -->

      <div class="modal-body">

        <form [formGroup]="form" class="row g-3">

          <!-- NOME -->

          <div class="col-12">
            <label class="form-label">
              Nome da Equipe
            </label>
            <input type="text" class="form-control" formControlName="teamName" placeholder="Produção">
          </div>

          <!-- DESCRIÇÃO -->
          <div class="col-12">

            <label class="form-label">
              Descrição
            </label>
            <textarea rows="4" class="form-control" formControlName="description"
              placeholder="Responsável pelo processo produtivo da empresa">
            </textarea>
          </div>

          <!-- ATIVO -->
          <div class="col-12">
            <div class="form-check form-switch">
              <input type="checkbox" class="form-check-input" formControlName="active">
              <label class="form-check-label">
                Equipe ativa
              </label>
            </div>
          </div>
        </form>

      </div>

      <!-- FOOTER -->

      <div class="modal-footer border-0">

        <button class="btn btn-outline-secondary" data-bs-dismiss="modal">

          Cancelar

        </button>

        <button class="btn btn-primary" [disabled]="form.invalid" (click)="submitTeam()">

          <i class="bi bi-check-circle me-2"></i>

          Criar Equipe

        </button>

      </div>

    </div>

  </div>

</div>
