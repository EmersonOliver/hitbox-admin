<div class="settings-card">

    <h4>Notificações</h4>

    <p class="text-muted">
        Controle como deseja ser avisado.
    </p>

    <div class="setting-row">

        <div>
            <strong>Email</strong>
            <small>Receber notificações por email.</small>
        </div>

        <input
            type="checkbox"
            class="form-check-input">

    </div>

    <div class="setting-row">

        <div>
            <strong>Push</strong>
            <small>Notificações dentro do sistema.</small>
        </div>

        <input
            type="checkbox"
            class="form-check-input"
            checked>

    </div>

    <div class="setting-row">

        <div>
            <strong>Produção</strong>
            <small>Avisar movimentação de cards.</small>
        </div>

        <input
            type="checkbox"
            class="form-check-input"
            checked>

    </div>

</div>
