<div class="profile-page">

    <div class="profile-header">

        <div class="profile-avatar">

            HS

        </div>

        <div>

            <h1 class="profile-name">

                Hitbox Studio

            </h1>

            <p class="profile-role">

                Administrador do Sistema

            </p>

        </div>

    </div>

    <div class="row g-4">

        <!-- DADOS -->

        <div class="col-lg-8">

            <div class="profile-card">

                <div class="card-header-custom">

                    <h4>
                        Dados Pessoais
                    </h4>

                    <p>

                    </p>

                </div>

                <div class="row g-3">

                    <div class="col-md-6">

                        <label class="form-label">

                            Nome

                        </label>

                        <input

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">

                            Sobrenome

                        </label>

                        <input

                    <div class="col-md-6">

                        <label class="form-label">

                            Email

                        </label>

                        <input

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">

                            Telefone

                        </label>

                        <input
                            type="text"

                    </div>

                </div>

                <div class="mt-4">

                    <button class="btn btn-primary">

                        Salvar Alterações

                    </button>

                </div>

            </div>

            <!-- SENHA -->

            <div class="profile-card mt-4">

                <div class="card-header-custom">

                    <h4>

                        Segurança

                    </h4>

                    <p>

                        Atualize sua senha.

                    </p>

                </div>

                <div class="row g-3">

                    <div class="col-12">

                        <label class="form-label">

                            Senha Atual

                        </label>

                        <input
                            type="password"

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">

                            Nova Senha

                        </label>

                        <input
                            type="password"
                            class="form-control">

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">

                            Confirmar Senha

                        </label>

                        <input
                            type="password"
                            class="form-control">

                    </div>

                </div>

                <div class="mt-4">

                    <button class="btn btn-warning">

                        Alterar Senha

                    </button>

                </div>

            </div>

        </div>

        <!-- SIDEBAR -->
        <div class="col-lg-4">
            <div class="profile-card">
                <div class="text-center">
                    <div class="profile-avatar large">

                        HS

                    </div>

                    <h4 class="mt-3">

                        Hitbox Studio

                    </h4>

                    <p class="text-muted">

                    </p>

                    <div>

                        <strong>

                            Último acesso

                        </strong>

                        </span>

                    </div>

                    </div>

                    <div>

                            Status

                        </span>

                    </div>

                </div>

                <h5>

                    Preferências

                </h5>

                <div class="form-check form-switch mt-3">

                    <input
                        class="form-check-input"
                        type="checkbox">

                    <label class="form-check-label">

                        Notificações por email

                    </label>

                </div>

                <div class="form-check form-switch mt-3">

                    <input
                        class="form-check-input"

                    <label class="form-check-label">
