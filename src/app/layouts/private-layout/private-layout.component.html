<div *ngIf="true" class="app-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar-area">
        <app-sidebar></app-sidebar>
    </aside>

    <!-- HEADER -->
    <header class="header-area">
        <app-header></app-header>
    </header>

    <!-- CONTENT -->
    <main class="content-area">
        <router-outlet></router-outlet>
    </main>

    <!-- MOBILE NAV -->
    <nav class="mobile-nav d-lg-none">

        <a class="mobile-link" routerLink="/dashboard" routerLinkActive="active">
            <i class="bi bi-grid"></i>
            <span>Dashboard</span>
        </a>

        <a class="mobile-link" *ngIf="permission.has('PRODUCT_VIEW')" routerLink="/produtos" routerLinkActive="active">
            <i class="bi bi-box"></i>
            <span>Produtos</span>
        </a>

        <a class="mobile-link" *ngIf="permission.has('CALCULATION_VIEW')" routerLink="/calculos" routerLinkActive="active">
            <i class="bi bi-calculator"></i>
            <span>Cálculos</span>
        </a>

        <a class="mobile-link" *ngIf="permission.has('REPORT_VIEW')" routerLink="/relatorios" routerLinkActive="active">
            <i class="bi bi-journal"></i>
            <span>Relatórios</span>
        </a>
    </nav>
</div>
