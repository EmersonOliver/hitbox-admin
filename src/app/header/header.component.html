<div class="header-actions">
    <div class="dropdown notification-dropdown">

        <button class="btn btn-theme position-relative" data-bs-toggle="dropdown" title="Notificações">

            <i class="bi bi-bell-fill"></i>

            <span *ngIf="unreadCount > 0" class="notification-badge">

                {{ unreadCount }}

            </span>

        </button>

        <div class="dropdown-menu dropdown-menu-end notification-menu shadow-lg">

            <div class="notification-header">

                <span>Notificações</span>

                <small>{{ unreadCount }} não lidas</small>

            </div>

            <div class="notification-list">

                <div *ngFor="let notification of visibleNotifications" class="notification-item"
                    [class.unread]="!notification.read" (click)="readMessageV2(notification); $event.stopPropagation()">

                    <div class="notification-content">

                        <div class="notification-title">

                            {{ notification.title }}

                        </div>

                        <div class="notification-message">
                            {{ notification.message }}
                        </div>

                        <div class="notification-date">
                            {{ notification.createAt | date:'dd/MM/yyyy HH:mm' }}
                        </div>
                    </div>
                </div>

            </div>

            <div *ngIf="visibleNotifications.length < notifications.length" class="notification-footer">

                <button class="btn btn-sm btn-outline-primary w-100" (click)="loadMore();$event.stopPropagation()">

                    Carregar mais

                </button>

            </div>

            <div class="notification-footer border-top">

                <button class="btn btn-link w-100" (click)="openNotificationsPage()">

                    Ver todas

                </button>

            </div>

        </div>

    </div>


    <!-- TEMA -->
    <button class="btn btn-theme" (click)="toggleTheme()">
        <i class="bi bi-moon"></i>
    </button>

    <!-- USUÁRIO -->
    <div class="dropdown">

        <button class="btn user-menu" data-bs-toggle="dropdown">

            <div class="avatar">
                {{initials}}
            </div>

            <div class="user-info d-none d-lg-flex">

                <span class="name">
                    {{firstName}}
                </span>

                <small>
                    {{role}}
                </small>

            </div>

            <i class="bi bi-chevron-down"></i>

        </button>

        <ul class="dropdown-menu dropdown-menu-end shadow-lg user-dropdown">

            <!-- USER HEADER -->
            <li class="dropdown-user">
                <div class="avatar-large">
                    {{initials}}
                </div>

                <div>
                    <strong>
                        {{firstName}}
                    </strong>

                    <small>
                        {{role}}
                    </small>
                </div>

            </li>

            <li>
                <hr class="dropdown-divider">
            </li>

            <!-- CONTA -->

            <li>
                <button class="dropdown-item" (click)="myProfile()">
                    <i class="bi bi-person"></i>
                    Meu Perfil
                </button>
            </li>

            <li>
                <button class="dropdown-item" (click)="changePassword()">
                    <i class="bi bi-key"></i>
                    Alterar Senha
                </button>
            </li>

            <li>
                <button class="dropdown-item" (click)="settings()">
                    <i class="bi bi-gear"></i>
                    Configurações
                </button>
            </li>

            <li>
                <hr class="dropdown-divider">
            </li>

            <!-- EMPRESA -->
            <li>
                <button class="dropdown-item" *ngIf="permission.has('COMPANY_VIEW')" (click)="myCompany()">
                    <i class="bi bi-building"></i>
                    Minha Empresa
                </button>
            </li>

            <li>
                <button class="dropdown-item" *ngIf="permission.has('TEAM_VIEW')" (click)="teams()">
                    <i class="bi bi-people"></i>
                    Equipes
                </button>
            </li>

            <li>

                <button class="dropdown-item" *ngIf="permission.has('PERMISSION_VIEW')" (click)="permissions()">

                    <i class="bi bi-shield-lock"></i>

                    Permissões

                </button>

            </li>

            <li>
                <hr class="dropdown-divider">
            </li>

            <!-- SISTEMA -->

            <li>

                <button class="dropdown-item" (click)="resetTutorial()">

                    <i class="bi bi-mortarboard"></i>

                    Reiniciar Tutorial

                </button>

            </li>


            <li>
                <hr class="dropdown-divider">
            </li>

            <!-- LOGOUT -->

            <li>

                <button class="dropdown-item text-danger" (click)="logout()">

                    <i class="bi bi-box-arrow-right"></i>
                    Sair
                </button>

            </li>

        </ul>

    </div>

</div>
